name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wayo_test
          POSTGRES_PASSWORD: wayo_test
          POSTGRES_DB: wayo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: npm ci
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e 'apps/api[dev]'
      - run: ruff check apps/api
      - run: ruff format --check apps/api
      - run: pytest apps/api/tests
      - run: pytest apps/api/tests/test_trip_storage.py apps/api/tests/test_catalog.py apps/api/tests/test_taste_snapshot.py apps/api/tests/test_availability.py
        env:
          WAYO_TEST_DATABASE_URL: postgresql+psycopg://wayo_test:wayo_test@127.0.0.1:5432/wayo_test
      - run: python apps/api/scripts/export_openapi.py
      - run: npm run api:types
      - run: git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api-schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
